name: Fork Full Rules Mirror

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fork-binary-rules.yml"
  schedule:
    # Run after Sukka's normal 05:17 / 17:17 UTC builds.
    - cron: "47 6 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-full-rules-mirror
  cancel-in-progress: true

env:
  DIST_BRANCH: rules-dist
  UPSTREAM_DIST_REPO: https://github.com/SukkaLab/ruleset.skk.moe.git
  SING_BOX_IMAGE: ghcr.io/sagernet/sing-box:v1.14.0-rc.4
  MIHOMO_IMAGE: docker.io/metacubex/mihomo:v1.19.30

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Sukka official generated rules
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master "${UPSTREAM_DIST_REPO}" official-dist
          git -C official-dist rev-parse HEAD > upstream-dist-commit.txt

      - name: Mirror every official generated output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          # Mirror the complete published output repository instead of maintaining
          # a platform allow-list. If Sukka adds a new client/output directory in
          # the future, it will automatically appear in rules-dist on the next run.
          rsync -a \
            --exclude='.git' \
            official-dist/ output/

      - name: Pull binary rule compilers
        run: |
          set -euo pipefail
          docker pull "${SING_BOX_IMAGE}"
          docker pull "${MIHOMO_IMAGE}"

      - name: Compile all sing-box Headless Rules to SRS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/SRS
          mkdir -p output/SRS

          count=0
          while IFS= read -r -d '' src; do
            rel="${src#official-dist/sing-box/}"
            out="output/SRS/${rel%.json}.srs"
            mkdir -p "$(dirname "$out")"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${SING_BOX_IMAGE}" \
              rule-set compile \
              --output "/work/${out}" \
              "/work/${src}"

            test -s "$out"
            count=$((count + 1))
          done < <(find official-dist/sing-box -type f -name '*.json' -print0 | sort -z)

          echo "Compiled ${count} SRS rule sets."
          test "$count" -gt 0

      - name: Compile Mihomo domain rule sets to MRS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/MRS
          mkdir -p output/MRS/domainset .tmp-mrs-domain

          count=0
          skipped=0
          while IFS= read -r -d '' src; do
            base="$(basename "$src" .txt)"
            cleaned=".tmp-mrs-domain/${base}.txt"
            out="output/MRS/domainset/${base}.mrs"

            # Compatibility/deprecated files may contain comments only.
            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$src" > "$cleaned"
            if [ ! -s "$cleaned" ]; then
              echo "Skip empty/deprecated domain set: ${base}"
              skipped=$((skipped + 1))
              continue
            fi

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${MIHOMO_IMAGE}" \
              convert-ruleset domain text \
              "/work/${cleaned}" \
              "/work/${out}"

            test -s "$out"
            count=$((count + 1))
          done < <(find official-dist/Clash/domainset -maxdepth 1 -type f -name '*.txt' -print0 | sort -z)

          rm -rf .tmp-mrs-domain
          echo "Compiled ${count} domain MRS rule sets; skipped ${skipped} empty/deprecated files."
          test "$count" -gt 0

      - name: Compile pure China IP CIDR sets to MRS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/MRS/ipcidr

          # Other Clash/ip files are classical/mixed rules and remain as the
          # mirrored official text files under Clash/ip/.
          for name in china_ip china_ip_ipv6; do
            src="official-dist/Clash/ip/${name}.txt"
            cleaned="${src}.clean"
            out="output/MRS/ipcidr/${name}.mrs"
            test -f "$src"

            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$src" > "$cleaned"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${MIHOMO_IMAGE}" \
              convert-ruleset ipcidr text \
              "/work/${cleaned}" \
              "/work/${out}"

            rm -f "$cleaned"
            test -s "$out"
          done

      - name: Write fork mirror metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" output

          upstream_sha="$(cat upstream-dist-commit.txt)"

          cat > output/FORK-README.md <<EOF
          # maniac911/Surge full rules mirror

          This branch is an automatic full mirror of Sukka's official generated
          rule output repository, plus binary formats generated for this fork.

          - Upstream output commit: \`${upstream_sha}\`
          - sing-box SRS compiler: \`${SING_BOX_IMAGE}\`
          - Mihomo MRS compiler: \`${MIHOMO_IMAGE}\`

          ## Mirrored upstream outputs

          Everything published by SukkaLab/ruleset.skk.moe is mirrored here,
          including current and future output directories. Current examples include:

          - \`List/\` — Surge
          - \`Clash/\` — Mihomo / Clash-compatible clients
          - \`LegacyClashPremium/\` — legacy Clash Premium
          - \`Surfboard/\` — Surfboard for Android
          - \`sing-box/\` — sing-box source-format Headless Rules
          - \`Modules/\` — Surge modules and related generated content

          ## Extra binary outputs

          - \`SRS/domainset/*.srs\`
          - \`SRS/non_ip/*.srs\`
          - \`SRS/ip/*.srs\`
          - \`MRS/domainset/*.mrs\`
          - \`MRS/ipcidr/china_ip*.mrs\`

          Mihomo classical/mixed rules remain available as the mirrored text files
          under \`Clash/non_ip/\` and \`Clash/ip/\` because MRS does not represent
          classical rule behavior.
          EOF

          find output -type f -not -name FILES.txt -printf '%P\n' | sort > output/FILES.txt

      - name: Publish full mirror to rules-dist branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$repo_url" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "$repo_url" publish-repo
          else
            git clone --depth 1 "$repo_url" publish-repo
            cd publish-repo
            git checkout --orphan "${DIST_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          cd publish-repo
          rsync -a --delete --exclude='.git' ../output/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No mirror or binary rule changes."
            exit 0
          fi

          git commit -m "chore: update full Sukka rules mirror"
          git push origin "HEAD:${DIST_BRANCH}"
