# FORK-INTEGRITY: main-sync-build
# Main fork-owned workflow.
# IMPORTANT: do not replace this file with SukkaW/Surge's workflow when using GitHub "Sync fork".
# The integrity guard below blocks builds if upstream-only workflows are imported or fork-owned automation is lost.
name: Sync Upstream and Build Rules

on:
  # Check upstream every 6 hours. Minute 47 avoids the top-of-hour Actions rush.
  schedule:
    - cron: "47 */6 * * *"
  # Manual runs can force a rebuild even when source/compiler fingerprints match rules-dist.
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when build inputs and compiler versions already match rules-dist
        required: false
        default: false
        type: boolean
  # Any direct master update is validated immediately. This is also what catches
  # an accidental GitHub web "Sync fork" before a release can be published.
  push:
    branches:
      - master

# Default to read-only. Only the publish job gets repository write permission;
# upstream sync uses the separately scoped SYNC_TOKEN.
permissions:
  contents: read

# Never run two sync/build pipelines concurrently. A queued run waits instead of
# cancelling the active release so partial output cannot win a race.
concurrency:
  group: clientruleset-sync-build
  cancel-in-progress: false

env:
  DIST_BRANCH: rules-dist
  UPSTREAM_REPO: https://github.com/SukkaW/Surge.git

jobs:
  sync-upstream:
    name: Sync SukkaW/Surge into fork master
    # Push events already contain the desired master revision; only scheduled/manual
    # runs need to fetch and merge upstream here.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      # Guard 1: validate the fork before touching upstream. This catches a previous
      # accidental web Sync fork or manual automation replacement.
      - name: Verify fork automation integrity before sync
        run: python3 ForkExtras/Scripts/fork_integrity.py

      - name: Verify sync token is configured
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [[ -z "${SYNC_TOKEN}" ]]; then
            echo "::error::SYNC_TOKEN is not configured"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream master

      - name: Merge upstream while preserving fork automation
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork master already contains upstream/master."
            exit 0
          fi

          before_merge="$(git rev-parse HEAD)"
          set +e
          git merge --no-ff --no-commit upstream/master
          merge_status=$?
          set -e

          # Fork-owned automation is authoritative. Restore it exactly from the
          # pre-merge commit so upstream workflow changes cannot be imported.
          git rm -rf --cached --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          rm -rf .github/workflows
          git checkout "${before_merge}" -- .github/workflows
          git checkout "${before_merge}" -- .github/dependabot.yml
          git add .github/workflows .github/dependabot.yml

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${unresolved}" ]]; then
            echo "::error::Upstream merge has unresolved conflicts outside fork automation:"
            printf '%s\n' "${unresolved}"
            exit 1
          fi

          if [[ "${merge_status}" -ne 0 ]]; then
            echo "Merge conflicts were limited to preserved automation files and were resolved with fork versions."
          fi

          # Guard 2: validate the merged tree before it is committed/pushed.
          # This catches future upstream path collisions or accidental workflow imports.
          python3 ForkExtras/Scripts/fork_integrity.py

          git commit -m "chore(sync): merge upstream master [skip actions]"
          git push origin HEAD:master

  plan-build:
    name: Check build inputs and latest stable compilers
    needs: sync-upstream
    if: >-
      always() &&
      (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip actions]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      build_input_fingerprint: ${{ steps.plan.outputs.build_input_fingerprint }}
      sing_box_tag: ${{ steps.plan.outputs.sing_box_tag }}
      sing_box_image: ${{ steps.plan.outputs.sing_box_image }}
      mihomo_tag: ${{ steps.plan.outputs.mihomo_tag }}
      mihomo_image: ${{ steps.plan.outputs.mihomo_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      # Guard 3: every master push is checked before build planning. In particular,
      # GitHub's web Sync fork creates a master update and therefore cannot silently
      # publish imported upstream automation.
      - name: Verify fork automation integrity before build planning
        run: python3 ForkExtras/Scripts/fork_integrity.py

      - name: Fetch upstream for build metadata
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream master

      # build_plan.py uses a source fingerprint plus the latest stable sing-box and
      # Mihomo releases. Documentation-only changes therefore do not force a rebuild.
      - name: Resolve build plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: python3 ForkExtras/Scripts/build_plan.py

  build:
    name: Build and verify generated rules
    needs: plan-build
    if: >-
      always() &&
      needs.plan-build.result == 'success' &&
      needs.plan-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      # Pin the build to the exact revision selected by plan-build to avoid a race
      # where master moves between planning and checkout.
      SOURCE_SHA: ${{ needs.plan-build.outputs.source_sha }}
      UPSTREAM_SHA: ${{ needs.plan-build.outputs.upstream_sha }}
      BUILD_INPUT_FINGERPRINT: ${{ needs.plan-build.outputs.build_input_fingerprint }}
      SING_BOX_TAG: ${{ needs.plan-build.outputs.sing_box_tag }}
      SING_BOX_IMAGE: ${{ needs.plan-build.outputs.sing_box_image }}
      MIHOMO_TAG: ${{ needs.plan-build.outputs.mihomo_tag }}
      MIHOMO_IMAGE: ${{ needs.plan-build.outputs.mihomo_image }}
      # Binary conversion is release-strict: no silent JSON fallback or failed MRS conversion.
      CLIENT_RELEASE_STRICT: "1"
      # Large output-count regressions are blocked; moderate drops are warnings.
      OUTPUT_COUNT_WARN_RATIO: "0.90"
      OUTPUT_COUNT_FAIL_RATIO: "0.70"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-build.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${SOURCE_SHA}" ]] || {
            echo "::error::Expected ${SOURCE_SHA}, checked out ${actual}"
            exit 1
          }

      # Re-check at the pinned build revision so integrity is part of the exact
      # reproducible source state being released.
      - name: Verify fork automation integrity at pinned source
        run: python3 ForkExtras/Scripts/fork_integrity.py

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      # Keep frozen-lockfile strictness. Only ERR_PNPM_OUTDATED_LOCKFILE may trigger
      # a temporary Runner-local lockfile repair; all other install errors still fail.
      - name: Install dependencies with guarded lockfile recovery
        run: |
          pnpm config set --location=global minimumReleaseAge 0
          python3 ForkExtras/Scripts/install_dependencies.py

      - name: Prepare previous build directory
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "https://github.com/${GITHUB_REPOSITORY}.git" output
            cp output/BUILD-METADATA.json .previous-build-metadata.json 2>/dev/null || true
            rm -rf output/.git
          else
            git clone --depth 1 --branch master https://github.com/SukkaLab/ruleset.skk.moe.git output
            rm -rf output/.git
          fi
          node ForkExtras/Clients/run.cjs prepare output

      # Check same-path collisions and duplicates before overlaying fork-only rules.
      - name: Check fork source before overlay
        run: python3 ForkExtras/Scripts/source_checks.py pre-overlay

      - name: Overlay fork-only source rules
        run: |
          set -euo pipefail
          if [[ -d ForkExtras/Source ]]; then
            rsync -a ForkExtras/Source/ Source/
          fi

      - name: Check merged source rules
        run: python3 ForkExtras/Scripts/source_checks.py post-overlay

      # Exact reject/Bilibili CIDR duplicates are removed; broader/narrower overlaps
      # are reported without deleting large parent networks automatically.
      - name: Exclude Bilibili HTTPDNS conflicts
        run: python3 ForkExtras/Scripts/bilibili_overlap.py

      - name: Build standard rules from this fork
        run: pnpm run build
        env:
          PUBLIC_DIR: ${{ github.workspace }}/output

      - name: Verify upstream build
        run: |
          set -euo pipefail
          test -f .BUILD_FINISHED
          test -d output/List
          test -d output/Clash
          test -d output/sing-box

      # Compiler tags are not fixed: each build plan resolves GitHub's latest stable
      # releases, while metadata records both the tag and immutable image digest.
      - name: Pull latest stable binary compilers
        run: |
          set -euo pipefail
          echo "sing-box release: ${SING_BOX_TAG}"
          echo "sing-box image:   ${SING_BOX_IMAGE}"
          echo "Mihomo release:   ${MIHOMO_TAG}"
          echo "Mihomo image:     ${MIHOMO_IMAGE}"

          docker pull "${SING_BOX_IMAGE}"
          docker pull "${MIHOMO_IMAGE}"

          sing_box_digest="$(docker image inspect --format='{{index .RepoDigests 0}}' "${SING_BOX_IMAGE}")"
          mihomo_digest="$(docker image inspect --format='{{index .RepoDigests 0}}' "${MIHOMO_IMAGE}")"

          {
            echo "SING_BOX_IMAGE_DIGEST=${sing_box_digest}"
            echo "MIHOMO_IMAGE_DIGEST=${mihomo_digest}"
          } >> "${GITHUB_ENV}"

      - name: Verify compiler image versions
        run: python3 ForkExtras/Scripts/compiler_smoke.py

      - name: Run client adapters in strict binary mode
        run: node ForkExtras/Clients/run.cjs release output

      - name: Remove stale renamed Bilibili artifacts
        run: find output -type f -name 'bilibili_httpdns.*' -delete

      # Writes BUILD-METADATA.json, MANIFEST.json and SHA256SUMS, and compares
      # output counts with the previous successful rules-dist release.
      - name: Finalize metadata and integrity manifests
        env:
          PREVIOUS_METADATA_PATH: .previous-build-metadata.json
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          python3 ForkExtras/Scripts/finalize_output.py

      # Hidden files such as .nojekyll are part of the integrity manifest and must
      # therefore be included in the build artifact.
      - name: Upload generated rules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-rules-${{ github.run_id }}
          path: output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish rules-dist
    needs:
      - plan-build
      - build
    if: >-
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The build itself is read-only. Only this isolated job may write rules-dist.
    permissions:
      contents: write
    steps:
      - name: Download generated rules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-rules-${{ github.run_id }}
          path: output

      # Verify the artifact again after upload/download before granting it publication.
      - name: Verify integrity before publish
        run: |
          set -euo pipefail
          cd output
          sha256sum --check SHA256SUMS
          python3 -m json.tool MANIFEST.json >/dev/null
          python3 -m json.tool BUILD-METADATA.json >/dev/null

      - name: Publish generated output to rules-dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan-build.outputs.source_sha }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${repo_url}" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "${repo_url}" publish-repo
          else
            git clone --depth 1 "${repo_url}" publish-repo
            cd publish-repo
            git checkout --orphan "${DIST_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          rsync -a --delete --exclude='.git' output/ publish-repo/
          cd publish-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "rules-dist already matches generated output."
            exit 0
          fi

          git commit -m "chore: build client releases from ${SOURCE_SHA}"
          git push origin "HEAD:${DIST_BRANCH}"
