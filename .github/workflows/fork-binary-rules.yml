name: Sync Upstream and Build Rules

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: fork-sync-and-build
  cancel-in-progress: true

env:
  DIST_BRANCH: rules-dist
  UPSTREAM_REPO: https://github.com/SukkaW/Surge.git
  SING_BOX_IMAGE: ghcr.io/sagernet/sing-box:v1.14.0-rc.4
  MIHOMO_IMAGE: docker.io/metacubex/mihomo:v1.19.30

jobs:
  sync-upstream:
    name: Sync SukkaW/Surge into fork master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream master
      - name: Merge upstream safely
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/master HEAD; then exit 0; fi
          git merge --no-edit upstream/master
          git push origin HEAD:master

  build-and-publish:
    name: Build from fork master and publish rules-dist
    needs: sync-upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Record source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm config set --location=global minimumReleaseAge 0
          pnpm install --frozen-lockfile
      - name: Prepare previous build directory
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "https://github.com/${GITHUB_REPOSITORY}.git" output
            rm -rf output/.git
          else
            git clone --depth 1 --branch master https://github.com/SukkaLab/ruleset.skk.moe.git output
            rm -rf output/.git
          fi
          node ForkExtras/Clients/run.cjs prepare output
      - name: Overlay fork-only source rules
        run: |
          set -euo pipefail
          if [ -d ForkExtras/Source ]; then rsync -a ForkExtras/Source/ Source/; fi
      - name: Build standard rules from this fork
        run: pnpm run build
        env:
          PUBLIC_DIR: ${{ github.workspace }}/output
      - name: Verify upstream build
        run: |
          set -euo pipefail
          test -f .BUILD_FINISHED
          test -d output/List
          test -d output/Clash
          test -d output/sing-box
      - name: Pull binary compilers
        run: |
          docker pull "${SING_BOX_IMAGE}"
          docker pull "${MIHOMO_IMAGE}"
      - name: Run client adapters
        run: node ForkExtras/Clients/run.cjs release output
      - name: Write fork build metadata
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" output
          cat > output/FORK-README.md <<EOF
          # maniac911/ClientRuleSet generated rules

          Built from fork source commit: ${SOURCE_SHA}

          Build flow: SukkaW/Surge -> fork master -> pnpm build -> ForkExtras client adapters -> rules-dist

          Client enable/disable settings live in ForkExtras/clients.yml on master.
          EOF
          find output -type f -not -name FILES.txt -printf '%P\n' | sort > output/FILES.txt
      - name: Publish generated output to rules-dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "$repo_url" publish-repo
          else
            git clone --depth 1 "$repo_url" publish-repo
            cd publish-repo
            git checkout --orphan "${DIST_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          rsync -a --delete --exclude='.git' output/ publish-repo/
          cd publish-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: build client releases from fork master ${SOURCE_SHA}"
          git push origin "HEAD:${DIST_BRANCH}"
