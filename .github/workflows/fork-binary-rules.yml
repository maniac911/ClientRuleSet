name: Sync Upstream and Build Rules

on:
  # One daily sync/build cycle. 06:47 UTC = 14:47 UTC+8.
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: fork-sync-and-build
  cancel-in-progress: true

env:
  DIST_BRANCH: rules-dist
  UPSTREAM_REPO: https://github.com/SukkaW/Surge.git
  SING_BOX_IMAGE: ghcr.io/sagernet/sing-box:v1.14.0-rc.4
  MIHOMO_IMAGE: docker.io/metacubex/mihomo:v1.19.30

jobs:
  sync-upstream:
    name: Sync SukkaW/Surge into fork master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream master

      - name: Merge upstream safely
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork master already contains the latest upstream master."
            exit 0
          fi

          # Preserve fork-only commits. If both sides changed the same lines,
          # fail instead of automatically choosing one side.
          git merge --no-edit upstream/master
          git push origin HEAD:master

  build-and-publish:
    name: Build from fork master and publish rules-dist
    needs: sync-upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout updated fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Record source commit
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm config set --location=global minimumReleaseAge 0
          pnpm install --frozen-lockfile

      - name: Prepare previous build directory
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "https://github.com/${GITHUB_REPOSITORY}.git" output
            rm -rf output/.git
          else
            # Sukka's build expects a non-empty PUBLIC_DIR in CI. Bootstrap it
            # from the official generated output only if rules-dist does not yet exist.
            git clone --depth 1 --branch master https://github.com/SukkaLab/ruleset.skk.moe.git output
            rm -rf output/.git
          fi

          # These binary formats are fork extras and are always rebuilt below.
          rm -rf output/MRS output/SRS

      - name: Overlay fork-only source rules
        shell: bash
        run: |
          set -euo pipefail

          # Put personal rules under ForkExtras/Source/ using the same layout as
          # Source/ (domainset/, non_ip/, ip/). They are copied only inside the
          # Actions runner, so upstream Source/ stays clean and easy to sync.
          if [ -d ForkExtras/Source ]; then
            rsync -a ForkExtras/Source/ Source/
          fi

      - name: Build standard rules from this fork
        run: pnpm run build
        env:
          PUBLIC_DIR: ${{ github.workspace }}/output

      - name: Verify source build
        shell: bash
        run: |
          set -euo pipefail
          test -f .BUILD_FINISHED
          test -d output/Clash
          test -d output/sing-box

      - name: Pull binary rule compilers
        run: |
          set -euo pipefail
          docker pull "${SING_BOX_IMAGE}"
          docker pull "${MIHOMO_IMAGE}"

      - name: Compile all sing-box Headless Rules to SRS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/SRS
          mkdir -p output/SRS

          count=0
          while IFS= read -r -d '' src; do
            rel="${src#output/sing-box/}"
            out="output/SRS/${rel%.json}.srs"
            mkdir -p "$(dirname "$out")"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${SING_BOX_IMAGE}" \
              rule-set compile \
              --output "/work/${out}" \
              "/work/${src}"

            test -s "$out"
            count=$((count + 1))
          done < <(find output/sing-box -type f -name '*.json' -print0 | sort -z)

          echo "Compiled ${count} SRS rule sets."
          test "$count" -gt 0

      - name: Compile Mihomo domain rule sets to MRS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/MRS
          mkdir -p output/MRS/domainset .tmp-mrs-domain

          count=0
          skipped=0
          while IFS= read -r -d '' src; do
            base="$(basename "$src" .txt)"
            cleaned=".tmp-mrs-domain/${base}.txt"
            out="output/MRS/domainset/${base}.mrs"

            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$src" > "$cleaned"
            if [ ! -s "$cleaned" ]; then
              echo "Skip empty/deprecated domain set: ${base}"
              skipped=$((skipped + 1))
              continue
            fi

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${MIHOMO_IMAGE}" \
              convert-ruleset domain text \
              "/work/${cleaned}" \
              "/work/${out}"

            test -s "$out"
            count=$((count + 1))
          done < <(find output/Clash/domainset -maxdepth 1 -type f -name '*.txt' -print0 | sort -z)

          rm -rf .tmp-mrs-domain
          echo "Compiled ${count} domain MRS rule sets; skipped ${skipped} empty/deprecated files."
          test "$count" -gt 0

      - name: Compile pure China IP CIDR sets to MRS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/MRS/ipcidr

          # Other Clash/ip rules can be classical/mixed, so only the known pure
          # China CIDR sets are converted to ipcidr MRS.
          for name in china_ip china_ip_ipv6; do
            src="output/Clash/ip/${name}.txt"
            cleaned="${src}.clean"
            out="output/MRS/ipcidr/${name}.mrs"
            test -f "$src"

            sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$src" > "$cleaned"

            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              "${MIHOMO_IMAGE}" \
              convert-ruleset ipcidr text \
              "/work/${cleaned}" \
              "/work/${out}"

            rm -f "$cleaned"
            test -s "$out"
          done

      - name: Write fork build metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" output

          cat > output/FORK-README.md <<EOF
          # maniac911/ClientRuleSet generated rules

          This branch is built automatically from this fork's current \`master\`
          after synchronizing \`SukkaW/Surge\` into the fork.

          - Fork source commit: \`${SOURCE_SHA}\`
          - Upstream source: \`SukkaW/Surge\`
          - sing-box SRS compiler: \`${SING_BOX_IMAGE}\`
          - Mihomo MRS compiler: \`${MIHOMO_IMAGE}\`

          ## Build flow

          \`SukkaW/Surge -> sync to fork master -> pnpm build -> SRS/MRS -> rules-dist\`

          Fork-only source rules can live under \`ForkExtras/Source/\`. During the
          workflow they are overlaid onto \`Source/\` only inside the runner, so
          the upstream source tree remains easy to synchronize.

          ## Outputs

          Standard outputs are generated by this fork's Sukka build code, including
          \`List/\`, \`Clash/\`, \`LegacyClashPremium/\`, \`Surfboard/\`,
          \`sing-box/\`, \`Modules/\`, and related generated files.

          Extra binary outputs:

          - \`SRS/domainset/*.srs\`
          - \`SRS/non_ip/*.srs\`
          - \`SRS/ip/*.srs\`
          - \`MRS/domainset/*.mrs\`
          - \`MRS/ipcidr/china_ip*.mrs\`

          Mihomo classical/mixed rules remain text because MRS represents only
          pure domain or IP-CIDR rule-set behavior.
          EOF

          find output -type f -not -name FILES.txt -printf '%P\n' | sort > output/FILES.txt

      - name: Publish generated output to rules-dist
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$repo_url" "${DIST_BRANCH}" >/dev/null 2>&1; then
            git clone --depth 1 --branch "${DIST_BRANCH}" "$repo_url" publish-repo
          else
            git clone --depth 1 "$repo_url" publish-repo
            cd publish-repo
            git checkout --orphan "${DIST_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          rsync -a --delete --exclude='.git' output/ publish-repo/

          cd publish-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi

          git commit -m "chore: build rules from fork master ${SOURCE_SHA}"
          git push origin "HEAD:${DIST_BRANCH}"
