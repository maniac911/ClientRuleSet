version: 1

# Add or remove client outputs here. An enabled client loads
# ForkExtras/Clients/adapters/<adapter>.cjs automatically.
#
# native_writer enables a build-time hook that injects a fork-only writer into
# Sukka's universal FileOutput fanout inside the Actions runner. The upstream
# Build/ tree in git remains unchanged.
clients:
  surge:
    enabled: true
    adapter: surge
    output: Surge

  clash:
    enabled: true
    adapter: clash
    output: Clash
    release: true

  sing-box:
    enabled: true
    adapter: sing-box
    output: sing-box
    release: true

  hiddify:
    enabled: true
    adapter: hiddify
    output: Hiddify

  shadowrocket:
    enabled: true
    adapter: shadowrocket
    native_writer: shadowrocket
    output: Shadowrocket

  quantumultx:
    enabled: true
    adapter: quantumultx
    native_writer: quantumultx
    output: QuantumultX
    # Quantumult X remote filters require a policy field. Consumers should use
    # force-policy=... in filter_remote; reject is a fail-visible placeholder.
    policy_placeholder: reject
    experimental:
      # Port filters stay in _report until remote-filter compatibility is verified.
      port_rules: false

  stash:
    enabled: true
    adapter: stash
    native_writer: stash
    output: Stash

  loon:
    enabled: true
    adapter: loon
    native_writer: loon
    output: Loon

  egern:
    enabled: true
    adapter: egern
    native_writer: egern
    output: Egern

  xray:
    enabled: true
    adapter: xray
    native_writer: xray
    output: Xray
    # Used by both Xray/v2rayN RulesItem files and Xray/native routing fragments.
    # Change it if the target profile/config uses another outbound tag.
    outbound_tag: proxy

  v2box:
    enabled: true
    adapter: v2box
    native_writer: v2box
    output: V2Box
    # V2Box route objects embed their outbound action, so publish all three
    # useful variants instead of forcing one policy into every rule set.
    tags:
      - proxy
      - direct
      - block

  surfboard:
    enabled: true
    adapter: passthrough
    output: Surfboard

  legacy-clash-premium:
    enabled: true
    adapter: passthrough
    output: LegacyClashPremium
